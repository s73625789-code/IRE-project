name: Google News Scraper

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

concurrency:
  group: google-news-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - email: followsky45@gmail.com
            session_secret: SESSION_FOLLOWSKY45
          - email: s73625789@gmail.com
            session_secret: SESSION_S73625789
          - email: malothrajashekar85@gmail.com
            session_secret: SESSION_MALOTHRAJASHEKAR85
          - email: rushikeshhatti@gmail.com
            session_secret: SESSION_RUSHIKESHHATTI

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install chromium

      - name: Restore session state
        env:
          SESSION_B64: ${{ secrets[matrix.session_secret] }}
        run: |
          python - <<'PY'
          import base64
          import os
          import pathlib

          data = os.environ["SESSION_B64"]
          out = pathlib.Path(os.environ["RUNNER_TEMP"]) / "session.json"

          try:
              payload = base64.b64decode(data, validate=True)
          except Exception:
              payload = data.encode("utf-8")

          out.write_bytes(payload)

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as fh:
              fh.write(f"SESSION_PATH={out}\n")
          PY

      - name: Run scraper for one user
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SESSION_DIR: ${{ runner.temp }}
        run: |
          python 2_pilot_scraper.py --user "${{ matrix.email }}" --session "$SESSION_PATH" --max-topics 4 --articles-per-topic 4 --max-articles 16 --min-hours-between-runs 16
